<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163FA8">
  <title>机构详情 - 创联职教云工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="brand-band app-header is-sub">
      <button type="button" class="btn-back" id="backBtn" aria-label="返回机构列表">
        <!-- lucide: chevron-left -->
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="header-info">
        <div class="header-title">机构详情</div>
        <div class="header-sub">查看机构详细信息及证照</div>
      </div>
      <span class="header-spacer"></span>
    </header>

    <main class="home-body module-body" id="detailBody">
      <!-- 详情字段（由 JS 渲染） -->
      <div class="detail-card" id="detailCard"></div>

      <!-- 扫描件 -->
      <div class="scan-card" id="scanCard" style="display:none">
        <div class="scan-head">
          <span class="scan-title">统一社会信用代码扫描件</span>
          <span class="scan-hint">点击查看大图，支持缩放</span>
        </div>
        <button type="button" class="scan-thumb" id="scanThumb" aria-label="查看扫描件大图"></button>
      </div>

      <!-- 状态说明 / 不通过原因 / 平台差异说明（由 JS 渲染） -->
      <div id="noteBox"></div>
    </main>

    <!-- 审核操作栏（仅待审核状态展示） -->
    <div class="action-bar" id="auditBar" style="display:none">
      <button type="button" class="btn-ghost danger" id="rejectBtn">
        <!-- lucide: x -->
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        审核不通过
      </button>
      <button type="button" class="btn-solid blue" id="approveBtn">
        <!-- lucide: check -->
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        审核通过
      </button>
    </div>
  </div>

  <!-- 审核通过二次确认 -->
  <div class="modal-mask" id="approveMask"></div>
  <div class="modal" id="approveModal" role="dialog" aria-modal="true">
    <div class="modal-icon brand">
      <!-- lucide: circle-check -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
    </div>
    <h3>确认审核通过？</h3>
    <p id="approveText">通过后该机构将获得登录资格。</p>
    <div class="modal-btns">
      <button type="button" class="btn-ghost" id="approveCancel">取消</button>
      <button type="button" class="btn-solid blue" id="approveConfirm">
        <span class="spinner" id="approveSpinner" style="display:none"></span>
        <span id="approveConfirmText">确认通过</span>
      </button>
    </div>
  </div>

  <!-- 审核不通过确认区（原因必填 1~200 字） -->
  <div class="sheet-mask" id="rejectMask"></div>
  <div class="sheet" id="rejectSheet" role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <div class="sheet-head">
      <h3>审核不通过</h3>
      <button type="button" class="sheet-close" id="rejectClose" aria-label="关闭">
        <!-- lucide: x -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <form id="rejectForm" novalidate>
      <div class="field" id="fieldReason">
        <label class="field-label" for="reasonInput">不通过原因<span class="req">*</span></label>
        <div class="textarea-wrap">
          <textarea id="reasonInput" placeholder="请输入不通过原因，提交后将展示给机构" maxlength="200"></textarea>
        </div>
        <div class="char-count"><span id="reasonCount">0</span>/200</div>
        <p class="field-error" id="reasonErr">不通过原因不能为空</p>
      </div>
      <button type="submit" class="btn-primary red" id="rejectSubmit">
        <span class="spinner" id="rejectSpinner" style="display:none"></span>
        <span id="rejectSubmitText">确认不通过</span>
      </button>
    </form>
  </div>

  <!-- 扫描件大图查看器：支持缩放 / 关闭 / 加载失败重新加载 -->
  <div class="viewer-mask" id="viewerMask">
    <div class="viewer-toolbar">
      <button type="button" class="vt-btn" id="zoomOut" aria-label="缩小">
        <!-- lucide: zoom-out -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
      </button>
      <span class="vt-label" id="zoomLabel">100%</span>
      <button type="button" class="vt-btn" id="zoomIn" aria-label="放大">
        <!-- lucide: zoom-in -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
      </button>
      <button type="button" class="vt-btn vt-close" id="viewerClose" aria-label="关闭查看器">
        <!-- lucide: x -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="viewer-stage" id="viewerStage">
      <div class="doc-wrap" id="docWrap"></div>
    </div>
    <div class="viewer-state" id="viewerState" style="display:none"></div>
  </div>

  <div class="toast" id="toast" role="alert"></div>

  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script>
  (function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };

    var ICONS = {
      alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>',
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>',
      refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 21H3v-5"/></svg>',
      zoom: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg>',
      image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>'
    };

    var STATUS_META = {
      pending: { text: '待审核', cls: 'tag-pending' },
      approved: { text: '已通过', cls: 'tag-approved' },
      rejected: { text: '不通过', cls: 'tag-rejected' }
    };

    /* ---------- Toast ---------- */
    var toastTimer = null;
    function toast(msg, isError) {
      var el = $('toast');
      el.textContent = msg;
      el.classList.toggle('toast-error', !!isError);
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
    }

    /* ---------- 会话守卫 + 定位机构 ---------- */
    var orgId = new URLSearchParams(location.search).get('id');
    var org = null;

    API.getSession().then(function (session) {
      if (!session) {
        sessionStorage.setItem(DB.EXPIRED_FLAG, '1');
        location.replace('index.html');
        return;
      }
      if (session.perms.indexOf('org') === -1 || !orgId) {
        location.replace(session.perms.indexOf('org') === -1 ? 'home.html' : 'org.html');
        return;
      }
      API.fetchOrgDetail(orgId).then(function (res) {
        if (res.code !== 0) {
          toast(res.message, true);
          setTimeout(function () { location.replace('org.html'); }, 900);
          return;
        }
        org = res.data;
        renderDetail();
        loadScan(false); // 预加载扫描件缩略图
      });
    });
    $('backBtn').addEventListener('click', function () { location.href = 'org.html'; });

    /* ---------- 详情渲染 ---------- */
    function kvRow(label, valueHTML) {
      return '<div class="kv-row"><span class="kv-label">' + label + '</span><span class="kv-value">' + valueHTML + '</span></div>';
    }

    function renderDetail() {
      var meta = STATUS_META[org.status];
      $('detailCard').innerHTML =
        kvRow('机构名称', org.name)
        + kvRow('管理员账号', '<span class="mono">' + org.adminAccount + '</span>')
        + kvRow('管理员密码', '<span class="mono">' + (org.adminPassword || '—') + '</span>')
        + kvRow('联系人姓名', org.contactName)
        + kvRow('联系人手机号', '<span class="mono">' + org.contactPhone + '</span>')
        + kvRow('统一社会信用代码', '<span class="mono">' + org.creditCode + '</span>')
        + kvRow('审核状态', '<span class="status-tag ' + meta.cls + '">' + meta.text + '</span>');
      $('scanCard').style.display = '';

      // 状态说明与平台差异（用户输入的原因用 DOM 文本写入，避免注入）
      var noteBox = $('noteBox');
      noteBox.innerHTML = '';
      if (org.status === 'approved') {
        // 已通过：无附加提示
      } else if (org.status === 'rejected') {
        var reasonTitle = document.createElement('h2');
        reasonTitle.className = 'section-title';
        reasonTitle.textContent = '不通过原因';
        noteBox.appendChild(reasonTitle);
        var rn = note('note-danger', ICONS.alert, '');
        rn.appendChild(document.createTextNode(org.rejectReason || '（未填写原因）'));
        noteBox.appendChild(rn);
        if (org.platform === 'hunan') {
          noteBox.appendChild(note('note-info', ICONS.info, '湖南平台：该机构可修改资料后再次提交，重新提交后状态将回到待审核并进入待审核队列。'));
        } else {
          noteBox.appendChild(note('note-neutral', ICONS.info, '该机构所在平台不支持审核不通过后再次提交。'));
        }
        noteBox.appendChild(note('note-neutral', ICONS.info, 'H5 端不提供申诉或人工修正入口，处理规则以平台差异逻辑为准。'));
      }

      // 审核限制：仅待审核状态展示审核操作
      var canAudit = org.status === 'pending';
      $('auditBar').style.display = canAudit ? '' : 'none';
      $('detailBody').classList.toggle('with-bar', canAudit);
    }

    function note(cls, icon, text) {
      var el = document.createElement('div');
      el.className = 'note-card ' + cls;
      el.innerHTML = icon;
      el.appendChild(document.createTextNode(text));
      return el;
    }

    /* ---------- 扫描件：加载（含失败重载） + 大图查看器（缩放/关闭） ---------- */
    var scanData = null;
    var scanLoading = false;

    function thumbStateHTML(icon, text, withBtn) {
      return '<div class="thumb-state">' + icon + '<span>' + text + '</span>'
        + (withBtn ? '<button type="button" class="btn-mini" id="thumbRetry">' + ICONS.refresh + '重新加载</button>' : '')
        + '</div>';
    }

    function loadScan(forViewer) {
      if (scanLoading) return;
      scanLoading = true;
      if (forViewer) showViewerState('loading');
      else $('scanThumb').innerHTML = '<div class="sk-line" style="width:100%;height:172px;border-radius:10px"></div>';

      API.fetchOrgScan(orgId).then(function (res) {
        scanLoading = false;
        if (res.code !== 0) {
          if (forViewer) showViewerState('error', res.message);
          else {
            $('scanThumb').innerHTML = thumbStateHTML(ICONS.alert, '加载失败', true);
            $('thumbRetry').addEventListener('click', function (e) {
              e.stopPropagation();
              loadScan(false);
            });
          }
          return;
        }
        scanData = res.data;
        var doc = buildDocSVG(scanData);
        if (forViewer) {
          hideViewerState();
          $('docWrap').innerHTML = doc;
          initViewerSize(); // 缩略图未就绪直接进查看器时也保证缩放基准正确
        } else {
          $('scanThumb').innerHTML = doc + '<span class="zoom-hint">' + ICONS.zoom + '</span>';
        }
      });
    }

    $('scanThumb').addEventListener('click', function () {
      if (!scanData) { loadScan(true); return; } // 缩略图尚未就绪，直接在查看器中加载
      openViewer();
    });

    var viewerMask = $('viewerMask');
    var zoom = 1;
    var baseW = 0;

    function initViewerSize() {
      zoom = 1;
      baseW = Math.min(340, Math.round(window.innerWidth * 0.82));
      applyZoom();
    }

    function openViewer() {
      initViewerSize();
      $('docWrap').innerHTML = buildDocSVG(scanData);
      hideViewerState();
      viewerMask.classList.add('show');
    }
    function closeViewer() { viewerMask.classList.remove('show'); }

    function showViewerState(kind, msg) {
      var st = $('viewerState');
      st.style.display = '';
      if (kind === 'loading') {
        st.innerHTML = '<span class="spinner"></span><span>正在加载扫描件…</span>';
      } else {
        st.innerHTML = '<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>'
          + '<span>' + (msg || '扫描件加载失败') + '</span>'
          + '<button type="button" class="btn-reload" id="viewerRetry">' + ICONS.refresh + '重新加载</button>';
        $('viewerRetry').addEventListener('click', function () { loadScan(true); });
      }
    }
    function hideViewerState() { $('viewerState').style.display = 'none'; }

    function applyZoom() {
      $('docWrap').style.width = Math.round(baseW * zoom) + 'px';
      $('zoomLabel').textContent = Math.round(zoom * 100) + '%';
      $('zoomIn').disabled = zoom >= 3;
      $('zoomOut').disabled = zoom <= 1;
    }
    $('zoomIn').addEventListener('click', function () {
      zoom = Math.min(3, zoom + 0.5); applyZoom();
    });
    $('zoomOut').addEventListener('click', function () {
      zoom = Math.max(1, zoom - 0.5); applyZoom();
    });
    $('viewerClose').addEventListener('click', closeViewer);
    viewerMask.addEventListener('click', function (e) {
      if (e.target === viewerMask || e.target === $('viewerStage')) closeViewer();
    });

    /* ---------- 扫描件文档（内联 SVG 模拟证照，随机构数据动态生成） ---------- */
    function buildDocSVG(s) {
      var esc = function (t) {
        return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      };
      var row = function (y, label, value) {
        return '<text x="22" y="' + y + '" font-size="13" fill="#8A8062">' + esc(label) + '</text>'
          + '<text x="86" y="' + y + '" font-size="13" fill="#333A45" font-weight="600">' + esc(value) + '</text>';
      };
      // 二维码占位（确定性图案）
      var qr = '';
      for (var i = 0; i < 7; i++) {
        for (var j = 0; j < 7; j++) {
          if ((i * j + i + j) % 3 !== 2) {
            qr += '<rect x="' + (268 + j * 6) + '" y="' + (408 + i * 6) + '" width="5" height="5" fill="#3A4048"/>';
          }
        }
      }
      return '<svg viewBox="0 0 340 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="统一社会信用代码扫描件" font-family="-apple-system,\'PingFang SC\',sans-serif">'
        + '<defs>'
        + '<linearGradient id="docHead' + s.id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8ECC8"/><stop offset="1" stop-color="#F1DFA6"/></linearGradient>'
        + '<linearGradient id="docPaper' + s.id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEFDF9"/><stop offset="1" stop-color="#F7F3E8"/></linearGradient>'
        + '</defs>'
        + '<rect width="340" height="480" rx="6" fill="url(#docPaper' + s.id + ')" stroke="#D8CBA4"/>'
        + '<path d="M0,6 a6,6 0 0 1 6,-6 h328 a6,6 0 0 1 6,6 v80 h-340 Z" fill="url(#docHead' + s.id + ')"/>'
        + '<text x="170" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#6B4E16">营业执照</text>'
        + '<text x="170" y="64" text-anchor="middle" font-size="13" fill="#8A6D2F" letter-spacing="6">(副本)</text>'
        + '<text x="22" y="106" font-size="12" fill="#8A8062">统一社会信用代码</text>'
        + '<text x="120" y="106" font-size="13.5" fill="#333A45" font-weight="700" font-family="\'DIN Alternate\',monospace" letter-spacing="1">' + esc(s.creditCode) + '</text>'
        + '<line x1="22" y1="118" x2="318" y2="118" stroke="#E4DCC2"/>'
        + row(146, '名　　称', s.name)
        + row(174, '类　　型', '有限责任公司')
        + row(202, '住　　所', s.address)
        + row(230, '法定代表人', s.contactName)
        + row(258, '成立日期', s.foundedAt)
        + row(286, '登记机关', s.issuer)
        + '<g transform="translate(132,368)">'
        + '<circle r="46" fill="rgba(214,69,69,.07)" stroke="#D64545" stroke-width="2.5"/>'
        + '<circle r="37" fill="none" stroke="#D64545" stroke-width="1"/>'
        + '<path transform="translate(0,-8) scale(1.5)" fill="#D64545" d="M0,-11 L2.7,-3.72 L10.46,-3.4 L4.37,1.42 L6.47,8.9 L0,4.6 L-6.47,8.9 L-4.37,1.42 L-10.46,-3.4 L-2.7,-3.72 Z"/>'
        + '<text y="22" text-anchor="middle" font-size="10" fill="#D64545" letter-spacing="2">专用印章</text>'
        + '</g>'
        + qr
        + '<text x="22" y="418" font-size="12" fill="#8A8062">登记日期</text>'
        + '<text x="22" y="438" font-size="13" fill="#333A45" font-weight="600" font-family="\'DIN Alternate\',monospace">' + esc(s.issuedAt) + '</text>'
        + '<text x="22" y="466" font-size="10" fill="#A89F84">扫描件仅供审核用途 · 信息以登记机关公示为准</text>'
        + '</svg>';
    }

    /* ---------- 审核通过（二次确认 → 提交 → 刷新详情） ---------- */
    var approving = false;
    $('approveBtn').addEventListener('click', function () {
      $('approveText').textContent = '通过后「' + org.name + '」将获得登录资格。';
      $('approveMask').classList.add('show');
      $('approveModal').classList.add('show');
    });
    function closeApprove() {
      $('approveMask').classList.remove('show');
      $('approveModal').classList.remove('show');
    }
    $('approveCancel').addEventListener('click', closeApprove);
    $('approveMask').addEventListener('click', closeApprove);
    $('approveConfirm').addEventListener('click', function () {
      if (approving) return; // 防重复提交
      approving = true;
      $('approveConfirm').disabled = true;
      $('approveSpinner').style.display = '';
      $('approveConfirmText').textContent = '提交中…';
      API.approveOrg(org.id).then(function (res) {
        if (res.code !== 0) {
          toast(res.message, true);
          approving = false;
          $('approveConfirm').disabled = false;
          $('approveSpinner').style.display = 'none';
          $('approveConfirmText').textContent = '确认通过';
          return;
        }
        // 审核成功：反馈后返回机构列表页
        closeApprove();
        toast('审核通过，机构已获得登录资格，正在返回列表…');
        setTimeout(function () { location.href = 'org.html'; }, 900);
      });
    });

    /* ---------- 审核不通过（原因必填 1~200 字 → 确认提交） ---------- */
    var rejecting = false;
    $('rejectBtn').addEventListener('click', function () {
      $('reasonInput').value = '';
      $('reasonCount').textContent = '0';
      $('fieldReason').classList.remove('is-invalid');
      $('reasonErr').textContent = '不通过原因不能为空';
      $('rejectMask').classList.add('show');
      $('rejectSheet').classList.add('show');
    });
    function closeReject() {
      $('rejectMask').classList.remove('show');
      $('rejectSheet').classList.remove('show');
    }
    $('rejectClose').addEventListener('click', closeReject);
    $('rejectMask').addEventListener('click', closeReject);
    $('reasonInput').addEventListener('input', function () {
      $('reasonCount').textContent = String(this.value.length);
      $('fieldReason').classList.remove('is-invalid');
    });
    $('rejectForm').addEventListener('submit', function (e) {
      e.preventDefault();
      if (rejecting) return; // 防重复提交
      var reason = $('reasonInput').value.trim();
      if (!reason) {
        $('fieldReason').classList.add('is-invalid');
        $('reasonErr').textContent = '不通过原因不能为空';
        $('reasonInput').focus();
        return;
      }
      if (reason.length > 200) {
        $('fieldReason').classList.add('is-invalid');
        $('reasonErr').textContent = '不通过原因不能超过 200 字';
        return;
      }
      rejecting = true;
      $('rejectSubmit').disabled = true;
      $('rejectSpinner').style.display = '';
      $('rejectSubmitText').textContent = '提交中…';
      API.rejectOrg(org.id, reason).then(function (res) {
        if (res.code !== 0) {
          $('fieldReason').classList.add('is-invalid');
          $('reasonErr').textContent = res.message || '提交失败，请重试';
          rejecting = false;
          $('rejectSubmit').disabled = false;
          $('rejectSpinner').style.display = 'none';
          $('rejectSubmitText').textContent = '确认不通过';
          return;
        }
        // 审核成功：反馈后返回机构列表页
        closeReject();
        toast('已提交审核不通过，正在返回列表…');
        setTimeout(function () { location.href = 'org.html'; }, 900);
      });
    });
  })();
  </script>
</body>
</html>
