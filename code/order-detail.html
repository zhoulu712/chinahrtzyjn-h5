<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163FA8">
  <title>订单详情 - 创联职教云工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="brand-band app-header is-sub">
      <button type="button" class="btn-back" id="backBtn" aria-label="返回订单列表">
        <!-- lucide: chevron-left -->
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="header-info">
        <div class="header-title">视频课订单详情</div>
        <div class="header-sub">查看订单信息并提交审核结论</div>
      </div>
      <span class="header-spacer"></span>
    </header>

    <main class="home-body module-body">
      <!-- 详情字段（由 JS 渲染：骨架 → 详情 / 失败态） -->
      <div id="detailBox"></div>
    </main>

    <!-- 审核操作栏（仅待审核状态展示） -->
    <div class="action-bar" id="auditBar" style="display:none">
      <button type="button" class="btn-ghost danger" id="rejectBtn">
        <!-- lucide: x -->
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        审核不通过
      </button>
      <button type="button" class="btn-solid blue" id="approveBtn">
        <!-- lucide: check -->
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        审核通过
      </button>
    </div>
  </div>

  <!-- 审核结论弹层（通过：付款方式必选；不通过：原因选填 1~200 字） -->
  <div class="sheet-mask" id="auditMask"></div>
  <div class="sheet" id="auditSheet" role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <div class="sheet-head">
      <h3 id="auditTitle">提交审核结论</h3>
      <button type="button" class="sheet-close" id="auditClose" aria-label="关闭">
        <!-- lucide: x -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div class="seg-tabs" id="segTabs">
      <button type="button" class="seg-tab active" data-verdict="approve">审核通过</button>
      <button type="button" class="seg-tab" data-verdict="reject">审核不通过</button>
    </div>

    <!-- 通过：付款方式必选；后付费须录入已付金额 -->
    <div id="approveSection">
      <div class="field" id="fieldPay">
        <label class="field-label">付款方式<span class="req">*</span></label>
        <div class="pay-opts">
          <button type="button" class="pay-opt" data-pay="先付费">先付费</button>
          <button type="button" class="pay-opt" data-pay="后付费">后付费</button>
        </div>
        <p class="field-error" id="payErr">请选择付款方式</p>
        <p class="time-hint">审核通过即开通订单内学员账号的学习权限；付款方式仅作订单信息留存，不触发支付流程。</p>
      </div>
      <div class="field" id="fieldPaid" style="display:none">
        <label class="field-label" for="paidInput">已付金额<span class="req">*</span></label>
        <div class="input-wrap">
          <input id="paidInput" type="text" inputmode="decimal" placeholder="允许为 0，最多两位小数" maxlength="12">
        </div>
        <p class="field-error" id="paidErr">后付费订单须录入已付金额</p>
        <p class="time-hint">允许为 0、非负且最多两位小数，允许超过订单总金额。</p>
      </div>
    </div>

    <!-- 不通过：原因选填 -->
    <div id="rejectSection" style="display:none">
      <div class="field" id="fieldReason">
        <label class="field-label" for="reasonInput">不通过原因<span class="opt-hint">（选填）</span></label>
        <div class="textarea-wrap">
          <textarea id="reasonInput" placeholder="请输入不通过原因；发起方可修改班级信息后重新提交订单" maxlength="200"></textarea>
        </div>
        <div class="char-count"><span id="reasonCount">0</span>/200</div>
        <p class="field-error" id="reasonErr">不通过原因不能超过 200 字</p>
      </div>
    </div>

    <button type="button" class="btn-primary" id="auditSubmit">
      <span class="spinner" id="auditSpinner" style="display:none"></span>
      <span id="auditSubmitText">提交</span>
    </button>
  </div>

  <div class="toast" id="toast" role="alert"></div>

  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script>
  (function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };
    var ORDER_ID = new URLSearchParams(location.search).get('id');

    var ICONS = {
      inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
      alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>',
      refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 21H3v-5"/></svg>',
      receipt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
    };

    var STATUS_META = {
      pending: { text: '待审核', cls: 'tag-pending' },
      approved: { text: '已通过', cls: 'tag-approved' },
      rejected: { text: '不通过', cls: 'tag-rejected' }
    };
    var order = null;

    /* ---------- Toast ---------- */
    var toastTimer = null;
    function toast(msg, isError) {
      var el = $('toast');
      el.textContent = msg;
      el.classList.toggle('toast-error', !!isError);
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
    }

    /* ---------- 会话守卫：失效/过期 → 回登录页 ---------- */
    API.getSession().then(function (session) {
      if (!session) {
        sessionStorage.setItem(DB.EXPIRED_FLAG, '1');
        location.replace('index.html');
        return;
      }
      if (session.perms.indexOf('order') === -1 || !ORDER_ID) {
        sessionStorage.setItem(DB.EXPIRED_FLAG, '1');
        location.replace('home.html');
        return;
      }
      loadOrder();
    });
    $('backBtn').addEventListener('click', function () { location.href = 'order.html'; });

    /* ---------- 数据加载 ---------- */
    function loadOrder() {
      $('detailBox').innerHTML =
        '<div class="detail-card">'
        + '<div class="skeleton-card"><div class="sk-line" style="width:62%"></div><div class="sk-line" style="width:44%;margin-top:12px"></div><div class="sk-line" style="width:70%;margin-top:10px"></div></div>'
        + '</div>';
      API.fetchOrderDetail(ORDER_ID).then(function (res) {
        if (res.code !== 0) { renderError(res.message); return; }
        order = res.data;
        renderDetail();
      });
    }

    function renderError(msg) {
      $('detailBox').innerHTML =
        '<div class="empty-state reveal">'
        + '<div class="empty-icon">' + ICONS.alert + '</div>'
        + '<h3>加载失败</h3>'
        + '<p>' + (msg || '网络异常，请检查后重试') + '</p>'
        + '<button type="button" class="btn-mini" id="retryBtn">' + ICONS.refresh + '重新加载</button>'
        + '</div>';
      $('retryBtn').addEventListener('click', loadOrder);
    }

    /* ---------- 详情渲染 ---------- */
    function kvRow(label, valueHtml, valueCls) {
      return '<div class="kv-row"><span class="kv-label">' + label + '</span>'
        + '<span class="kv-value' + (valueCls ? ' ' + valueCls : '') + '">' + valueHtml + '</span></div>';
    }

    function renderDetail() {
      var meta = STATUS_META[order.status];
      var html =
        '<section class="detail-card reveal">'
        + kvRow('订单编号', esc(order.id), 'mono-num')
        + kvRow('班级名称', esc(order.klassName))
        + kvRow('班级学员人数', order.studentCount + ' 人')
        + kvRow('订单总金额', '<span class="kv-amount">' + DB.formatAmount(order.totalAmount) + '</span>')
        + kvRow('购买机构', esc(order.orgName))
        + kvRow('审核状态', '<span class="status-tag ' + meta.cls + '">' + meta.text + '</span>')
        + '</section>';

      // 审核信息：仅展示已产生的结论、付款方式、已付金额与不通过原因
      if (order.status !== 'pending') {
        html +=
          '<p class="sec-label">审核信息</p>'
          + '<section class="detail-card reveal">'
          + kvRow('审核结论', order.status === 'approved' ? '审核通过' : '审核不通过')
          + (order.status === 'approved'
              ? kvRow('付款方式', esc(order.paymentType)) + kvRow('已付金额', '<span class="mono-num">' + DB.formatAmount(order.paidAmount) + '</span>')
              : '')
          + (order.status === 'rejected' && order.rejectReason
              ? '<div class="kv-row kv-top"><span class="kv-label">不通过原因</span><span class="kv-value">' + esc(order.rejectReason) + '</span></div>'
              : '')
          + '</section>';
      }

      $('detailBox').innerHTML = html;
      var canAudit = order.status === 'pending';
      $('auditBar').style.display = canAudit ? '' : 'none';
      document.querySelector('.module-body').classList.toggle('with-bar', canAudit);
    }

    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ---------- 审核弹层 ---------- */
    var verdict = 'approve';   // 当前结论：approve | reject
    var payType = '';          // 已选付款方式
    var submitting = false;

    function openAudit(v) {
      verdict = v;
      payType = '';
      // 重置表单
      Array.prototype.forEach.call(document.querySelectorAll('.seg-tab'), function (b) {
        b.classList.toggle('active', b.getAttribute('data-verdict') === verdict);
      });
      Array.prototype.forEach.call(document.querySelectorAll('.pay-opt'), function (b) {
        b.classList.remove('active');
      });
      $('approveSection').style.display = verdict === 'approve' ? '' : 'none';
      $('rejectSection').style.display = verdict === 'reject' ? '' : 'none';
      $('fieldPaid').style.display = 'none';
      $('paidInput').value = '';
      ['fieldPay', 'fieldPaid', 'fieldReason'].forEach(function (id) { $(id).classList.remove('is-invalid'); });
      $('reasonInput').value = '';
      $('reasonCount').textContent = '0';
      syncSubmitBtn();
      $('auditMask').classList.add('show');
      $('auditSheet').classList.add('show');
    }
    function closeAudit() {
      $('auditMask').classList.remove('show');
      $('auditSheet').classList.remove('show');
    }
    $('approveBtn').addEventListener('click', function () { openAudit('approve'); });
    $('rejectBtn').addEventListener('click', function () { openAudit('reject'); });
    $('auditClose').addEventListener('click', closeAudit);
    $('auditMask').addEventListener('click', closeAudit);

    // 结论切换
    Array.prototype.forEach.call(document.querySelectorAll('.seg-tab'), function (b) {
      b.addEventListener('click', function () {
        verdict = b.getAttribute('data-verdict');
        Array.prototype.forEach.call(document.querySelectorAll('.seg-tab'), function (x) {
          x.classList.toggle('active', x === b);
        });
        $('approveSection').style.display = verdict === 'approve' ? '' : 'none';
        $('rejectSection').style.display = verdict === 'reject' ? '' : 'none';
        syncSubmitBtn();
      });
    });

    // 付款方式选择（先付费不要求录入已付金额；后付费必录）
    Array.prototype.forEach.call(document.querySelectorAll('.pay-opt'), function (b) {
      b.addEventListener('click', function () {
        payType = b.getAttribute('data-pay');
        Array.prototype.forEach.call(document.querySelectorAll('.pay-opt'), function (x) {
          x.classList.toggle('active', x === b);
        });
        $('fieldPay').classList.remove('is-invalid');
        $('fieldPaid').style.display = payType === '后付费' ? '' : 'none';
      });
    });

    $('reasonInput').addEventListener('input', function () {
      $('reasonCount').textContent = String(this.value.length);
      $('fieldReason').classList.remove('is-invalid');
    });

    function syncSubmitBtn() {
      var ok = verdict === 'approve';
      $('auditSubmit').classList.toggle('red', !ok);
      $('auditSubmitText').textContent = '提交';
    }

    /* ---------- 提交：前端校验 → 提交 → 反馈并返回列表 ---------- */
    $('auditSubmit').addEventListener('click', function () {
      if (submitting) return; // 防重复提交
      if (verdict === 'approve' && !payType) {
        $('fieldPay').classList.add('is-invalid');
        return;
      }
      var amount = '';
      if (verdict === 'approve' && payType === '后付费') {
        amount = $('paidInput').value.trim();
        if (!amount) {
          $('fieldPaid').classList.add('is-invalid');
          $('paidErr').textContent = '后付费订单须录入已付金额';
          $('paidInput').focus();
          return;
        }
        if (!/^\d+(\.\d{1,2})?$/.test(amount)) {
          $('fieldPaid').classList.add('is-invalid');
          $('paidErr').textContent = '已付金额须为非负数字且最多两位小数';
          $('paidInput').focus();
          return;
        }
      }
      var reason = verdict === 'reject' ? $('reasonInput').value.trim() : '';
      if (reason.length > 200) {
        $('fieldReason').classList.add('is-invalid');
        $('reasonErr').textContent = '不通过原因不能超过 200 字';
        return;
      }

      submitting = true;
      var submitBtn = $('auditSubmit');
      submitBtn.disabled = true;
      $('auditSpinner').style.display = '';
      $('auditSubmitText').textContent = '提交中…';
      var isPass = verdict === 'approve';
      var req = isPass
        ? API.approveOrder(order.id, payType, amount)
        : API.rejectOrder(order.id, reason);
      req.then(function (res) {
        if (res.code !== 0) {
          toast(res.message, true);
        } else {
          closeAudit();
          toast(isPass ? '审核通过，已开通学员学习权限，正在返回列表…' : '已提交审核不通过，正在返回列表…');
          setTimeout(function () { location.href = 'order.html'; }, 900);
          return; // 返回列表，无需复位按钮态
        }
        submitting = false;
        submitBtn.disabled = false;
        $('auditSpinner').style.display = 'none';
        $('auditSubmitText').textContent = '提交';
      });
    });
  })();
  </script>
</body>
</html>
