<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163FA8">
  <title>班级信息管理 - 创联职教云工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <!-- 模块页头（与机构管理同壳：渐变品牌带，返回 + 标题） -->
    <header class="brand-band app-header is-sub">
      <button type="button" class="btn-back" id="backBtn" aria-label="返回工作台">
        <!-- lucide: chevron-left -->
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="header-info">
        <div class="header-title">班级信息管理</div>
        <div class="header-sub">按机构/班级名称查询并调整班期</div>
      </div>
      <span class="header-spacer"></span>
    </header>

    <main class="home-body module-body">
      <!-- 吸顶查询区：机构/班级名称关键词（必填）+ 查询按钮 -->
      <div class="org-tabs-card">
        <div class="search-row">
          <div class="input-wrap" id="kwWrap">
            <!-- lucide: search -->
            <svg class="icon lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="keyword" type="text" placeholder="请输入机构或班级名称关键词（必填）" maxlength="30" autocomplete="off">
            <button type="button" class="clear-btn" id="clearKw" aria-label="清空关键词" style="display:none">
              <!-- lucide: x -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
          <button type="button" class="btn-query" id="btnQuery">
            <!-- lucide: search -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            查询
          </button>
        </div>
      </div>

      <!-- 下拉刷新指示条 -->
      <div class="ptr-bar" id="ptrBar">
        <!-- lucide: arrow-down -->
        <svg class="ptr-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
        <span class="spinner mini" id="ptrSpinner" style="display:none"></span>
        <span id="ptrText">下拉刷新</span>
      </div>

      <!-- 班级列表（引导态 / 骨架 / 列表 / 空态 / 错误态 由 JS 渲染） -->
      <div id="listBox"></div>
      <div id="footState"></div>
    </main>
  </div>

  <!-- 调整班期时间底部弹层 -->
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="adjustSheet" role="dialog" aria-label="调整班期时间">
    <div class="grabber"></div>
    <div class="sheet-head">
      <h3>调整班期时间</h3>
      <button type="button" class="sheet-close" id="sheetClose" aria-label="关闭">
        <!-- lucide: x -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="ro-box">
      <div class="ro-row"><span class="ro-label">所属机构</span><span class="ro-value" id="roOrg">—</span></div>
      <div class="ro-row"><span class="ro-label">班级名称</span><span class="ro-value" id="roName">—</span></div>
    </div>
    <div class="time-field" id="fieldStart">
      <label class="tf-label" for="fStart">开始时间<span class="req">*</span></label>
      <div class="input-wrap">
        <!-- lucide: calendar -->
        <svg class="icon lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        <input type="datetime-local" id="fStart" step="1">
      </div>
      <p class="field-error">请选择开始时间</p>
    </div>
    <div class="time-field" id="fieldEnd">
      <label class="tf-label" for="fEnd">结束时间<span class="req">*</span></label>
      <div class="input-wrap">
        <!-- lucide: calendar -->
        <svg class="icon lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        <input type="datetime-local" id="fEnd" step="1">
      </div>
      <p class="field-error" id="endError">请选择结束时间</p>
    </div>
    <div class="time-hint">
      <!-- lucide: info -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span>时间精确到秒，开始时间不得晚于结束时间；保存后立即生效并同步至学员端课表。</span>
    </div>
    <button type="button" class="btn-primary" id="btnSaveTime">
      <span class="spinner" id="saveSpinner" style="display:none"></span>
      <span id="saveBtnText">保存调整</span>
    </button>
  </div>

  <div class="toast" id="toast" role="alert"></div>

  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script>
  (function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };

    var PAGE_SIZE = 6;

    var ICONS = {
      landmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>',
      book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>',
      calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>',
      pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>',
      bookOpen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>',
      inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
      alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>',
      refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 21H3v-5"/></svg>'
    };

    var GUIDE_HTML =
      '<div class="empty-state reveal">'
      + '<div class="empty-icon">' + ICONS.bookOpen + '</div>'
      + '<h3>按机构或班级查询</h3>'
      + '<p>输入机构或班级名称关键词并点击「查询」，<br>即可查看匹配班级的学时与班期时间，并支持调整班期。</p>'
      + '</div>';

    /* ---------- Toast ---------- */
    var toastTimer = null;
    function toast(msg, isError) {
      var el = $('toast');
      el.textContent = msg;
      el.classList.toggle('toast-error', !!isError);
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
    }

    /* ---------- 工具 ---------- */
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    // 'yyyy-MM-ddTHH:mm'（datetime-local）→ 'yyyy-MM-dd HH:mm:ss'（DB 口径）
    function toStamp(v) {
      if (!v) return '';
      var s = String(v).replace('T', ' ');
      if (s.length === 16) s += ':00';
      return s;
    }

    /* ---------- 状态 ---------- */
    var state = { keyword: '', page: 0, total: 0, hasMore: false, searched: false, loading: false, loadingMore: false, failed: false };
    var list = [];

    /* ---------- 会话守卫：失效/过期 → 回登录页；无班级菜单权限 → 回工作台 ---------- */
    API.getSession().then(function (session) {
      if (!session) {
        sessionStorage.setItem(DB.EXPIRED_FLAG, '1');
        location.replace('index.html');
        return;
      }
      if (session.perms.indexOf('klass') === -1) {
        sessionStorage.setItem(DB.EXPIRED_FLAG, '1');
        location.replace('home.html');
        return;
      }
      $('listBox').innerHTML = GUIDE_HTML;
    });
    $('backBtn').addEventListener('click', function () { location.href = 'home.html'; });

    /* ---------- 关键词输入 ---------- */
    $('keyword').addEventListener('input', function () {
      $('kwWrap').classList.remove('is-error');
      $('clearKw').style.display = this.value ? '' : 'none';
    });
    $('clearKw').addEventListener('click', function () {
      $('keyword').value = '';
      $('clearKw').style.display = 'none';
      $('kwWrap').classList.remove('is-error');
      state.searched = false;
      state.hasMore = false;
      state.failed = false;
      list = [];
      setFoot('');
      $('listBox').innerHTML = GUIDE_HTML;
    });
    $('keyword').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); doQuery(); }
    });

    /* ---------- 查询（关键词必填，避免全量扫描） ---------- */
    $('btnQuery').addEventListener('click', doQuery);
    function doQuery() {
      if (state.loading) return;
      var kw = $('keyword').value.trim();
      if (!kw) {
        $('kwWrap').classList.add('is-error');
        toast('请先输入机构或班级名称关键词', true);
        return;
      }
      state.keyword = kw;
      state.searched = true;
      state.failed = false;
      $('btnQuery').disabled = true;
      loadFirst();
    }

    /* ---------- 加载 ---------- */
    function loadFirst(silent) {
      state.loading = true;
      if (!silent) $('listBox').innerHTML = skeletonHTML();
      else setFoot('<span class="spinner mini"></span>正在刷新…');
      API.fetchKlasses({ keyword: state.keyword, page: 1, pageSize: PAGE_SIZE })
        .then(function (res) {
          state.loading = false;
          $('btnQuery').disabled = false;
          if (res.code !== 0) {
            state.failed = true;
            renderError(res.message);
            return;
          }
          state.page = 1;
          state.total = res.data.total;
          state.hasMore = res.data.hasMore;
          list = res.data.list;
          if (!list.length) {
            renderEmpty();
            setFoot('');
          } else {
            renderCards(0);
            setFoot(state.hasMore ? '' : '— 没有更多了 —');
          }
        });
    }

    function loadMore() {
      if (!state.searched || state.loading || state.loadingMore || state.failed || !state.hasMore) return;
      state.loadingMore = true;
      setFoot('<span class="spinner mini"></span>加载中…');
      API.fetchKlasses({ keyword: state.keyword, page: state.page + 1, pageSize: PAGE_SIZE })
        .then(function (res) {
          state.loadingMore = false;
          if (res.code !== 0) {
            setFoot('加载失败，<button type="button" class="fill-link" id="retryMore">重试</button>');
            var r = $('retryMore');
            if (r) r.addEventListener('click', loadMore);
            return;
          }
          state.page += 1;
          var from = list.length;
          list = list.concat(res.data.list);
          state.hasMore = res.data.hasMore;
          renderCards(from);
          setFoot(state.hasMore ? '' : '— 没有更多了 —');
        });
    }

    /* ---------- 触底加载 ---------- */
    window.addEventListener('scroll', function () {
      if (!state.searched || state.failed) return;
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 96) loadMore();
    });

    /* ---------- 下拉刷新（触屏：列表在顶部时下拉） ---------- */
    var ptr = { startY: 0, active: false, armed: false, refreshing: false };
    var ptrBar = $('ptrBar');
    document.addEventListener('touchstart', function (e) {
      if (ptr.refreshing || state.loading || !state.searched) return;
      if (window.scrollY > 0) return;
      ptr.startY = e.touches[0].clientY;
      ptr.active = true;
      ptr.armed = false;
    }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      if (!ptr.active || ptr.refreshing) return;
      var dy = e.touches[0].clientY - ptr.startY;
      if (window.scrollY > 0 || dy <= 0) {
        ptrBar.style.height = '0px';
        ptrBar.classList.remove('armed');
        ptr.armed = false;
        return;
      }
      e.preventDefault(); // 顶部下拉时接管手势
      var h = Math.min(dy * 0.55, 88);
      ptrBar.style.height = h + 'px';
      ptr.armed = h >= 52;
      ptrBar.classList.toggle('armed', ptr.armed);
      $('ptrText').textContent = ptr.armed ? '松开立即刷新' : '下拉刷新';
    }, { passive: false });
    document.addEventListener('touchend', function () {
      if (!ptr.active) return;
      ptr.active = false;
      if (ptr.armed) {
        ptr.armed = false;
        ptr.refreshing = true;
        ptrBar.classList.add('refreshing');
        ptrBar.classList.remove('armed');
        ptrBar.style.height = '52px';
        $('ptrSpinner').style.display = '';
        $('ptrText').textContent = '正在刷新…';
        API.fetchKlasses({ keyword: state.keyword, page: 1, pageSize: PAGE_SIZE })
          .then(function (res) {
            ptr.refreshing = false;
            ptrBar.classList.remove('refreshing');
            ptrBar.style.height = '0px';
            $('ptrSpinner').style.display = 'none';
            $('ptrText').textContent = '下拉刷新';
            if (res.code !== 0) { toast(res.message, true); return; }
            state.page = 1;
            state.total = res.data.total;
            state.hasMore = res.data.hasMore;
            state.failed = false;
            list = res.data.list;
            if (!list.length) {
              renderEmpty();
              setFoot('');
            } else {
              renderCards(0);
              setFoot(state.hasMore ? '' : '— 没有更多了 —');
            }
            toast('已刷新');
          });
      } else {
        ptrBar.style.height = '0px';
        ptrBar.classList.remove('armed');
      }
    });

    /* ---------- 渲染 ---------- */
    function setFoot(html) {
      $('footState').innerHTML = html ? '<div class="list-foot">' + html + '</div>' : '';
    }

    function skeletonHTML() {
      var html = '';
      for (var i = 0; i < 4; i++) {
        html += '<div class="skeleton-card">'
          + '<div class="sk-line" style="width:' + (52 + (i % 3) * 9) + '%"></div>'
          + '<div class="sk-line" style="width:38%;margin-top:12px"></div>'
          + '<div class="sk-line" style="width:66%;margin-top:10px"></div>'
          + '</div>';
      }
      return html;
    }

    function renderError(msg) {
      $('btnQuery').disabled = false;
      $('listBox').innerHTML =
        '<div class="empty-state reveal">'
        + '<div class="empty-icon">' + ICONS.alert + '</div>'
        + '<h3>加载失败</h3>'
        + '<p>' + esc(msg || '网络异常，请检查后重试') + '</p>'
        + '<button type="button" class="btn-mini" id="retryBtn">' + ICONS.refresh + '重新加载</button>'
        + '</div>';
      setFoot('');
      var r = $('retryBtn');
      if (r) r.addEventListener('click', function () { loadFirst(); });
    }

    function renderEmpty() {
      $('listBox').innerHTML =
        '<div class="empty-state reveal">'
        + '<div class="empty-icon">' + ICONS.inbox + '</div>'
        + '<h3>未找到匹配班级</h3>'
        + '<p>没有机构或班级名称包含「' + esc(state.keyword) + '」的记录，<br>请确认关键词后重新查询。</p>'
        + '<button type="button" class="btn-mini" id="emptyReset">' + ICONS.refresh + '清空关键词</button>'
        + '</div>';
      var b = $('emptyReset');
      if (b) b.addEventListener('click', function () { $('clearKw').click(); });
    }

    function cardHTML(k, i) {
      var endInner = k.endTime
        ? '<span class="kc-tv">' + esc(k.endTime) + '</span>'
        : '<span class="kc-tv">未设置</span>';
      return '<article class="klass-card reveal" data-id="' + esc(k.id) + '" style="animation-delay:' + (i % 10) * 0.05 + 's">'
        + '<div class="kc-org">' + ICONS.landmark + '<span>' + esc(k.orgName) + '</span></div>'
        + '<div class="kc-name">' + esc(k.name) + '</div>'
        + '<div class="oc-row">' + ICONS.book + '<span>共 <span class="mono">' + esc(k.hours) + '</span> 学时</span></div>'
        + '<div class="kc-bottom">'
        + '<div class="kc-times">'
        + '<div class="kc-time-line">' + ICONS.calendar + '<span class="kc-tl">开始</span><span class="kc-tv">' + esc(k.startTime) + '</span></div>'
        + '<div class="kc-time-line' + (k.endTime ? '' : ' is-unset') + '">' + ICONS.calendar + '<span class="kc-tl">结束</span>' + endInner + '</div>'
        + '</div>'
        + '<button type="button" class="btn-adjust" data-id="' + esc(k.id) + '">' + ICONS.pencil + '调整时间</button>'
        + '</div>'
        + '</article>';
    }

    function renderCards(from) {
      var html = '';
      for (var i = from || 0; i < list.length; i++) html += cardHTML(list[i], i);
      if (from) $('listBox').insertAdjacentHTML('beforeend', html);
      else $('listBox').innerHTML = html;
    }

    // 就地刷新某张卡片（保存成功后，不整列表重绘、不打断滚动位置）
    function refreshCard(id) {
      var el = document.querySelector('.klass-card[data-id="' + id + '"]');
      if (!el) return;
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) { el.outerHTML = cardHTML(list[i], i); return; }
      }
    }

    /* ---------- 卡片按钮：打开调整弹层（事件委托） ---------- */
    $('listBox').addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.btn-adjust') : null;
      if (!btn) return;
      var id = btn.getAttribute('data-id');
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) { openSheet(list[i]); return; }
      }
    });

    /* ---------- 调整班期时间弹层 ---------- */
    var adjusting = null; // 当前调整的班级引用
    var saving = false;

    function openSheet(k) {
      adjusting = k;
      saving = false;
      $('roOrg').textContent = k.orgName;
      $('roName').textContent = k.name;
      $('fStart').value = k.startTime ? k.startTime.replace(' ', 'T') : '';
      $('fEnd').value = k.endTime ? k.endTime.replace(' ', 'T') : '';
      resetFieldError();
      $('saveSpinner').style.display = 'none';
      $('saveBtnText').textContent = '保存调整';
      $('btnSaveTime').disabled = false;
      $('sheetMask').classList.add('show');
      $('adjustSheet').classList.add('show');
    }

    function closeSheet() {
      if (saving) return; // 保存中不允许关闭，防止状态错乱
      $('sheetMask').classList.remove('show');
      $('adjustSheet').classList.remove('show');
      adjusting = null;
    }

    function resetFieldError() {
      $('fieldStart').classList.remove('is-invalid');
      $('fieldEnd').classList.remove('is-invalid');
      $('endError').textContent = '请选择结束时间';
    }
    ['fStart', 'fEnd'].forEach(function (id) {
      $(id).addEventListener('input', function () {
        this.closest('.time-field').classList.remove('is-invalid');
      });
    });

    $('sheetClose').addEventListener('click', closeSheet);
    $('sheetMask').addEventListener('click', closeSheet);

    /* ---------- 保存：前端校验 → 直接提交（防重复提交，无需二次确认） ---------- */
    $('btnSaveTime').addEventListener('click', function () {
      if (saving || !adjusting) return;
      var s = toStamp($('fStart').value);
      var e = toStamp($('fEnd').value);
      resetFieldError();
      if (!s) { $('fieldStart').classList.add('is-invalid'); }
      if (!e) { $('fieldEnd').classList.add('is-invalid'); }
      if (!s || !e) { toast('请先补全开始与结束时间', true); return; }
      if (s > e) { // 同格式字符串字典序即时间序
        $('endError').textContent = '开始时间不得晚于结束时间';
        $('fieldEnd').classList.add('is-invalid');
        return;
      }
      saving = true;
      $('saveSpinner').style.display = '';
      $('saveBtnText').textContent = '保存中…';
      $('btnSaveTime').disabled = true;
      // TODO: replace with fetch('POST /api/klasses/:id/update-time')
      API.updateKlassTime(adjusting.id, { startTime: s, endTime: e })
        .then(function (res) {
          saving = false;
          $('saveSpinner').style.display = 'none';
          $('saveBtnText').textContent = '保存调整';
          $('btnSaveTime').disabled = false;
          if (res.code !== 0) {
            toast(res.message || '保存失败，请稍后重试', true);
            return;
          }
          var updatedId = adjusting.id;
          adjusting.startTime = s;
          adjusting.endTime = e;
          closeSheet();
          refreshCard(updatedId);
          toast('班期时间已更新');
        });
    });
  })();
  </script>
</body>
</html>
