<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163FA8">
  <title>应急处理 - 创联职教云工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <!-- 模块页头（与机构管理同壳：渐变品牌带，返回 + 标题） -->
    <header class="brand-band app-header is-sub">
      <button type="button" class="btn-back" id="backBtn" aria-label="返回工作台">
        <!-- lucide: chevron-left -->
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="header-info">
        <div class="header-title">应急处理</div>
        <div class="header-sub">学员资料维护与登录密码重置</div>
      </div>
      <span class="header-spacer"></span>
    </header>

    <main class="home-body module-body">
      <!-- 吸顶查询区：姓名 / 身份证号 / 手机号，至少一项（支持组合条件） -->
      <div class="org-tabs-card">
        <div class="stu-form">
          <div class="stu-form-row">
            <div class="input-wrap" id="wrapName">
              <!-- lucide: user-round -->
              <svg class="icon lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
              <input id="qName" type="text" placeholder="学员姓名（选填）" maxlength="20" autocomplete="off">
            </div>
            <div class="input-wrap" id="wrapPhone">
              <!-- lucide: phone -->
              <svg class="icon lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <input id="qPhone" type="tel" inputmode="numeric" placeholder="手机号（选填）" maxlength="11" autocomplete="off">
            </div>
          </div>
          <div class="stu-form-row">
            <div class="input-wrap" id="wrapIdcard">
              <!-- lucide: credit-card -->
              <svg class="icon lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
              <input id="qIdcard" type="text" placeholder="身份证号（选填，可输部分号码）" maxlength="18" autocomplete="off" style="text-transform:uppercase">
            </div>
            <button type="button" class="btn-query" id="btnQuery">
              <!-- lucide: search -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              查询
            </button>
          </div>
        </div>
      </div>

      <!-- 下拉刷新指示条 -->
      <div class="ptr-bar" id="ptrBar">
        <!-- lucide: arrow-down -->
        <svg class="ptr-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
        <span class="spinner mini" id="ptrSpinner" style="display:none"></span>
        <span id="ptrText">下拉刷新</span>
      </div>

      <!-- 学员列表（引导态 / 骨架 / 列表 / 空态 / 错误态 由 JS 渲染） -->
      <div id="listBox"></div>
      <div id="footState"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="alert"></div>

  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script>
  (function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };

    var LS_KEY = 'eduops.stu.searchstate';

    var ICONS = {
      idcard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>',
      phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
      users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
      inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
      alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>',
      refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 21H3v-5"/></svg>'
    };

    var GUIDE_HTML =
      '<div class="empty-state reveal">'
      + '<div class="empty-icon">' + ICONS.users + '</div>'
      + '<h3>按条件检索学员</h3>'
      + '<p>填写学员姓名、身份证号或手机号中的至少一项后查询，<br>支持组合条件精确定位，用于应急场景下的资料维护。</p>'
      + '</div>';

    /* ---------- Toast ---------- */
    var toastTimer = null;
    function toast(msg, isError) {
      var el = $('toast');
      el.textContent = msg;
      el.classList.toggle('toast-error', !!isError);
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* ---------- 状态 ---------- */
    var state = { name: '', idcard: '', phone: '', searched: false, loading: false, failed: false };
    var list = [];

    /* ---------- 会话守卫 ---------- */
    API.getSession().then(function (session) {
      if (!session) {
        sessionStorage.setItem(DB.EXPIRED_FLAG, '1');
        location.replace('index.html');
        return;
      }
      if (session.perms.indexOf('emergency') === -1) {
        sessionStorage.setItem(DB.EXPIRED_FLAG, '1');
        location.replace('home.html');
        return;
      }
      restoreState();
    });
    $('backBtn').addEventListener('click', function () { location.href = 'home.html'; });

    /* ---------- 查询条件输入（三个输入框：输入即清错误态 + 控制清空按钮） ---------- */
    var FIELDS = [
      { input: 'qName', wrap: 'wrapName' },
      { input: 'qIdcard', wrap: 'wrapIdcard' },
      { input: 'qPhone', wrap: 'wrapPhone' }
    ];
    FIELDS.forEach(function (f) {
      $(f.input).addEventListener('input', function () {
        $(f.wrap).classList.remove('is-error');
      });
      $(f.input).addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); doQuery(); }
      });
    });

    // 详情页返回后还原查询条件并自动重新查询
    function restoreState() {
      var raw = null;
      try { raw = sessionStorage.getItem(LS_KEY); } catch (e) {}
      if (!raw) { $('listBox').innerHTML = GUIDE_HTML; return; }
      try {
        var s = JSON.parse(raw);
        sessionStorage.removeItem(LS_KEY);
        if (s && (s.name || s.idcard || s.phone)) {
          $('qName').value = s.name || '';
          $('qIdcard').value = s.idcard || '';
          $('qPhone').value = s.phone || '';
          state.name = s.name || '';
          state.idcard = s.idcard || '';
          state.phone = s.phone || '';
          state.searched = true;
          loadList();
          return;
        }
      } catch (e) {}
      $('listBox').innerHTML = GUIDE_HTML;
    }

    /* ---------- 查询（至少一项，组合条件为 AND） ---------- */
    $('btnQuery').addEventListener('click', doQuery);
    function doQuery() {
      if (state.loading) return;
      var name = $('qName').value.trim();
      var idcard = $('qIdcard').value.trim();
      var phone = $('qPhone').value.trim();
      if (!name && !idcard && !phone) {
        ['wrapName', 'wrapIdcard', 'wrapPhone'].forEach(function (id) { $(id).classList.add('is-error'); });
        toast('请至少填写一个查询条件', true);
        return;
      }
      state.name = name;
      state.idcard = idcard;
      state.phone = phone;
      state.searched = true;
      state.failed = false;
      $('btnQuery').disabled = true;
      loadList();
    }

    function loadList() {
      state.loading = true;
      $('listBox').innerHTML = skeletonHTML();
      setFoot('');
      API.searchStudents({ name: state.name, idcard: state.idcard, phone: state.phone })
        .then(function (res) {
          state.loading = false;
          $('btnQuery').disabled = false;
          if (res.code !== 0) {
            state.failed = true;
            renderError(res.message);
            return;
          }
          list = res.data.list;
          if (!list.length) {
            renderEmpty();
            setFoot('');
          } else {
            renderList();
            setFoot('— 共 ' + res.data.total + ' 名学员 —');
          }
        });
    }

    /* ---------- 下拉刷新（触屏：列表在顶部时下拉） ---------- */
    var ptr = { startY: 0, active: false, armed: false, refreshing: false };
    var ptrBar = $('ptrBar');
    document.addEventListener('touchstart', function (e) {
      if (ptr.refreshing || state.loading || !state.searched) return;
      if (window.scrollY > 0) return;
      ptr.startY = e.touches[0].clientY;
      ptr.active = true;
      ptr.armed = false;
    }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      if (!ptr.active || ptr.refreshing) return;
      var dy = e.touches[0].clientY - ptr.startY;
      if (window.scrollY > 0 || dy <= 0) {
        ptrBar.style.height = '0px';
        ptrBar.classList.remove('armed');
        ptr.armed = false;
        return;
      }
      e.preventDefault();
      var h = Math.min(dy * 0.55, 88);
      ptrBar.style.height = h + 'px';
      ptr.armed = h >= 52;
      ptrBar.classList.toggle('armed', ptr.armed);
      $('ptrText').textContent = ptr.armed ? '松开立即刷新' : '下拉刷新';
    }, { passive: false });
    document.addEventListener('touchend', function () {
      if (!ptr.active) return;
      ptr.active = false;
      if (ptr.armed) {
        ptr.armed = false;
        ptr.refreshing = true;
        ptrBar.classList.add('refreshing');
        ptrBar.classList.remove('armed');
        ptrBar.style.height = '52px';
        $('ptrSpinner').style.display = '';
        $('ptrText').textContent = '正在刷新…';
        API.searchStudents({ name: state.name, idcard: state.idcard, phone: state.phone })
          .then(function (res) {
            ptr.refreshing = false;
            ptrBar.classList.remove('refreshing');
            ptrBar.style.height = '0px';
            $('ptrSpinner').style.display = 'none';
            $('ptrText').textContent = '下拉刷新';
            if (res.code !== 0) { toast(res.message, true); return; }
            state.failed = false;
            list = res.data.list;
            if (!list.length) {
              renderEmpty();
              setFoot('');
            } else {
              renderList();
              setFoot('— 共 ' + res.data.total + ' 名学员 —');
            }
            toast('已刷新');
          });
      } else {
        ptrBar.style.height = '0px';
        ptrBar.classList.remove('armed');
      }
    });

    /* ---------- 渲染 ---------- */
    function setFoot(html) {
      $('footState').innerHTML = html ? '<div class="list-foot">' + html + '</div>' : '';
    }

    function skeletonHTML() {
      var html = '';
      for (var i = 0; i < 4; i++) {
        html += '<div class="skeleton-card">'
          + '<div class="sk-line" style="width:' + (40 + (i % 3) * 10) + '%"></div>'
          + '<div class="sk-line" style="width:56%;margin-top:12px"></div>'
          + '<div class="sk-line" style="width:44%;margin-top:10px"></div>'
          + '</div>';
      }
      return html;
    }

    function renderError(msg) {
      $('btnQuery').disabled = false;
      $('listBox').innerHTML =
        '<div class="empty-state reveal">'
        + '<div class="empty-icon">' + ICONS.alert + '</div>'
        + '<h3>加载失败</h3>'
        + '<p>' + esc(msg || '网络异常，请检查后重试') + '</p>'
        + '<button type="button" class="btn-mini" id="retryBtn">' + ICONS.refresh + '重新加载</button>'
        + '</div>';
      setFoot('');
      var r = $('retryBtn');
      if (r) r.addEventListener('click', function () { loadList(); });
    }

    function renderEmpty() {
      $('listBox').innerHTML =
        '<div class="empty-state reveal">'
        + '<div class="empty-icon">' + ICONS.inbox + '</div>'
        + '<h3>未找到匹配学员</h3>'
        + '<p>当前条件下没有匹配的学员，<br>请调整或减少查询条件后重试。</p>'
        + '</div>';
    }

    function cardHTML(s) {
      return '<article class="org-card stu-card reveal" data-id="' + esc(s.id) + '">'
        + '<div class="oc-top">'
        + '<div class="oc-name">' + esc(s.name) + '</div>'
        + '<span class="stu-chev">' + ICONS.chevron + '</span>'
        + '</div>'
        + '<div class="oc-row">' + ICONS.idcard + '<span class="mono">' + esc(s.idcard) + '</span></div>'
        + '<div class="oc-row">' + ICONS.phone + '<span class="mono">' + esc(s.phone) + '</span></div>'
        + '</article>';
    }

    function renderList() {
      var html = '';
      for (var i = 0; i < list.length; i++) html += cardHTML(list[i], i);
      $('listBox').innerHTML = html;
    }

    /* ---------- 卡片点击 → 学员详情（保存查询条件供返回还原） ---------- */
    $('listBox').addEventListener('click', function (e) {
      var card = e.target.closest ? e.target.closest('.stu-card') : null;
      if (!card) return;
      try { sessionStorage.setItem(LS_KEY, JSON.stringify({ name: state.name, idcard: state.idcard, phone: state.phone })); } catch (err) {}
      location.href = 'emergency-detail.html?id=' + encodeURIComponent(card.getAttribute('data-id'));
    });
  })();
  </script>
</body>
</html>
