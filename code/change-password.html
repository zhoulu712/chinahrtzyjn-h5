<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163FA8">
  <title>修改登录密码 - 创联职教云工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="brand-band app-header is-sub">
      <button type="button" class="btn-back" id="backBtn" aria-label="返回工作台">
        <!-- lucide: chevron-left -->
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="header-info">
        <div class="header-title">修改登录密码</div>
        <div class="header-sub">修改成功后需使用新密码重新登录</div>
      </div>
      <span class="header-spacer"></span>
    </header>

    <main class="home-body module-body">
      <!-- 账号卡：账号来自登录态，仅展示 -->
      <section class="account-card reveal" id="accountCard">
        <div class="card-label">
          <!-- lucide: user-round -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
          当前登录账号
        </div>
        <div class="account-name" id="accountName">—</div>
        <div class="account-sub">修改成功后将清除本地登录会话，请使用新密码重新登录</div>
      </section>

      <!-- 修改密码表单（页面形式，非弹层） -->
      <section class="auth-card reveal" style="margin:16px 0 0">
        <div class="pwd-rule">
          <!-- lucide: shield-check -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
          <span>新密码规则沿用后台管理系统：长度 8~20 位，须同时包含字母和数字。</span>
        </div>
        <form id="pwdForm" novalidate>
          <div class="field" id="fieldOld">
            <label class="field-label" for="oldPwd">原密码<span class="req">*</span></label>
            <div class="input-wrap">
              <!-- lucide: lock -->
              <svg class="icon lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="oldPwd" type="password" placeholder="请输入原密码" autocomplete="current-password" maxlength="20">
              <button type="button" class="eye-toggle" data-target="oldPwd" aria-label="显示或隐藏密码">
                <svg class="icon eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
              </button>
            </div>
            <p class="field-error" id="oldErr">原密码不能为空</p>
          </div>

          <div class="field" id="fieldNew">
            <label class="field-label" for="newPwd">新密码<span class="req">*</span></label>
            <div class="input-wrap">
              <!-- lucide: lock -->
              <svg class="icon lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="newPwd" type="password" placeholder="8~20 位，须含字母和数字" autocomplete="new-password" maxlength="20">
              <button type="button" class="eye-toggle" data-target="newPwd" aria-label="显示或隐藏密码">
                <svg class="icon eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
              </button>
            </div>
            <p class="field-error" id="newErr">新密码不能为空</p>
          </div>

          <div class="field" id="fieldConfirm">
            <label class="field-label" for="confirmPwd">确认新密码<span class="req">*</span></label>
            <div class="input-wrap">
              <!-- lucide: lock -->
              <svg class="icon lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="confirmPwd" type="password" placeholder="请再次输入新密码" autocomplete="new-password" maxlength="20">
              <button type="button" class="eye-toggle" data-target="confirmPwd" aria-label="显示或隐藏密码">
                <svg class="icon eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
              </button>
            </div>
            <p class="field-error" id="confirmErr">确认密码不能为空</p>
          </div>

          <button type="submit" class="btn-primary" id="pwdSubmit">
            <span class="spinner" id="pwdSpinner" style="display:none"></span>
            <span id="pwdSubmitText">确认修改</span>
          </button>
        </form>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="alert"></div>

  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script>
  (function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };
    var session = null;
    var pwdSubmitting = false;

    /* ---------- Toast ---------- */
    var toastTimer = null;
    function toast(msg, isError) {
      var el = $('toast');
      el.textContent = msg;
      el.classList.toggle('toast-error', !!isError);
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
    }

    /* ---------- 会话守卫：失效/过期 → 回登录页 ---------- */
    API.getSession().then(function (s) {
      if (!s) {
        sessionStorage.setItem(DB.EXPIRED_FLAG, '1');
        location.replace('index.html');
        return;
      }
      session = s;
      $('accountName').textContent = s.username;
    });
    $('backBtn').addEventListener('click', function () { location.href = 'home.html'; });

    // 密码显示 / 隐藏（三个字段统一处理）
    Array.prototype.forEach.call(document.querySelectorAll('.eye-toggle'), function (btn) {
      btn.addEventListener('click', function () {
        var input = $(btn.getAttribute('data-target'));
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.querySelector('.eye-on').style.display = show ? 'none' : '';
        btn.querySelector('.eye-off').style.display = show ? '' : 'none';
      });
    });

    function fieldError(fieldId, errId, msg) {
      $(fieldId).classList.toggle('is-invalid', !!msg);
      $(errId).textContent = msg || '';
    }

    // 新密码规则沿用后台：8~20 位且同时包含字母和数字
    function validNewPwd(v) {
      return v.length >= 8 && v.length <= 20 && /[A-Za-z]/.test(v) && /\d/.test(v);
    }

    $('pwdForm').addEventListener('submit', function (e) {
      e.preventDefault();
      if (pwdSubmitting) return; // 防重复提交

      var oldV = $('oldPwd').value;
      var newV = $('newPwd').value;
      var confV = $('confirmPwd').value;

      var ok = true;
      if (!oldV) { fieldError('fieldOld', 'oldErr', '原密码不能为空'); ok = false; } else fieldError('fieldOld', 'oldErr', '');
      if (!newV) { fieldError('fieldNew', 'newErr', '新密码不能为空'); ok = false; }
      else if (!validNewPwd(newV)) { fieldError('fieldNew', 'newErr', '新密码须为 8~20 位且同时包含字母和数字'); ok = false; }
      else fieldError('fieldNew', 'newErr', '');
      if (!confV) { fieldError('fieldConfirm', 'confirmErr', '确认密码不能为空'); ok = false; }
      else if (confV !== newV) { fieldError('fieldConfirm', 'confirmErr', '两次输入的新密码不一致'); ok = false; }
      else fieldError('fieldConfirm', 'confirmErr', '');
      if (!ok) return;

      if (!session) return; // 会话守卫尚未完成
      pwdSubmitting = true;
      $('pwdSubmit').disabled = true;
      $('pwdSpinner').style.display = '';
      $('pwdSubmitText').textContent = '提交中…';

      API.changePassword({
        username: session.username,
        oldPassword: oldV,
        newPassword: newV
      }).then(function (res) {
        if (res.code !== 0) {
          fieldError('fieldOld', 'oldErr', res.message || '原密码不正确');
          return;
        }
        // 修改成功：使既有会话失效并提示重新登录
        API.clearSession();
        toast('密码修改成功，请使用新密码重新登录');
        setTimeout(function () { location.replace('index.html'); }, 1400);
      }).finally(function () {
        pwdSubmitting = false;
        $('pwdSubmit').disabled = false;
        $('pwdSpinner').style.display = 'none';
        $('pwdSubmitText').textContent = '确认修改';
      });
    });
  })();
  </script>
</body>
</html>
